<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Üçgenin Yardımcı Elemanları</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--green:#30a14e;--orange:#ff9500;--purple:#af52de;--red:#ff3b30;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:#3a3a3c;--blue:#2997ff;--green:#32d74b;--orange:#ff9f0a;--purple:#bf5af2;--red:#ff453a}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:#3a3a3c;--blue:#2997ff;--green:#32d74b;--orange:#ff9f0a;--purple:#bf5af2;--red:#ff453a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:36px 20px 48px}
h1{font-size:clamp(28px,4.5vw,44px);letter-spacing:-.02em;margin:0 0 6px;font-weight:700}
.sub{color:var(--mute);font-size:17px;margin:0 0 24px}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:color-mix(in srgb,var(--mute) 18%,transparent);padding:3px;border-radius:12px;margin-bottom:20px}
.tabs button{border:0;background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:500;padding:8px 16px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.desc{font-size:15px;line-height:1.5;margin:0 0 12px}
svg{width:100%;height:auto;display:block;touch-action:none;overflow:hidden;background:color-mix(in srgb,var(--bg) 60%,var(--card));border-radius:14px;user-select:none}
svg text{fill:var(--ink);font-family:inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:980px;cursor:pointer}
.bar button:hover{border-color:var(--blue);color:var(--blue)}
.chip{margin-left:auto;font-size:13px;color:var(--blue);font-weight:600}
.hint{font-size:12px;color:var(--mute);margin:10px 0 0}
.side{display:flex;flex-direction:column;gap:16px}
.tg{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.tg:last-child{border:0}
.tg input{appearance:none;width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex:none}
.tg input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.tg input:checked{background:var(--green)}
.tg input:checked::after{left:18px}
.sl{padding-top:10px;font-size:14px;color:var(--mute)}
.sl input{width:100%;accent-color:var(--blue)}
.fc{padding:14px 0;border-bottom:1px solid var(--line)}
.fc:first-child{padding-top:0}.fc:last-child{border:0;padding-bottom:0}
.fc h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600}
.fm{margin:0 0 6px;padding:7px 10px;background:var(--bg);border-radius:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.row{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.row b{color:var(--blue);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mute);margin:6px 0 0;line-height:1.45}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.dl{stroke-dasharray:1;animation:dr .9s ease-out both}
.fi{animation:fi .7s ease both}
svg *{transition:none}
.bar button#play{background:var(--blue);border-color:var(--blue);color:#fff}
.bar button#play:hover{color:#fff;opacity:.85}
@media (prefers-reduced-motion:reduce){.dl,.fi{animation:none}}
.wrap{position:relative}h1{padding-right:130px}
.theme{position:absolute;top:40px;right:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:7px 14px;border-radius:980px;cursor:pointer}
.svw{position:relative}svg{cursor:grab}svg:active{cursor:grabbing}
.zm{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zm button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 85%,transparent);color:var(--ink);font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}
.zm button:hover{color:var(--blue);border-color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <button class="theme" id="theme"></button>
  <h1>Üçgenin Yardımcı Elemanları</h1>
  <p class="sub">Köşeleri sürükle; özelliklerin her üçgende geçerli olduğunu canlı gör.</p>
  <div class="tabs" id="tabs">
    <button data-m="bis" class="on">Açıortay</button><button data-m="med">Kenarortay</button><button data-m="per">Kenar orta dik</button><button data-m="alt">Yükseklik</button>
  </div>
  <div class="grid">
    <div class="card">
      <p class="desc" id="desc"></p>
      <div class="svw"><svg id="sv" viewBox="0 0 640 460"><g id="g"></g></svg><div class="zm"><button id="zin" title="Yakınlaştır">+</button><button id="zout" title="Uzaklaştır">−</button><button id="zfit" title="Tüm noktaları sığdır">⤢</button><button id="zrst" title="Görünümü sıfırla">⟲</button></div></div>
      <div class="bar" id="presets">
        <button data-p="dar">Dar açılı</button><button data-p="dik">Dik açılı</button><button data-p="genis">Geniş açılı</button><button data-p="esk">Eşkenar</button>
        <button id="play">▶ Hareket</button><span class="chip" id="chip"></span>
      </div>
      <p class="hint">İpucu: A, B ve C noktalarını fare ya da parmakla sürükle.</p>
    </div>
    <div class="side">
      <div class="card" id="ctrls"></div>
      <div class="card" id="facts"></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const W=640,H=460,U=40;
const PR={dar:[[260,70],[110,380],[540,340]],dik:[[150,100],[150,370],[500,370]],genis:[[200,200],[90,370],[560,370]],esk:[[320,50],[120,396],[520,396]]};
let P=PR.dar.map(([x,y])=>({x,y})),mode='bis',tt=70,gt=60,anim=true,playing=0;
let vb={x:0,y:0,w:640,h:460},FIT=[],pan=null;const zs=()=>Math.max(1,vb.w/640);
const on={bis:{inc:1,thm:1,arc:1,pg:1,ex:0,exc:0},med:{ratio:1,area:0,mid:0},per:{circ:1,eq:1,pt:1},alt:{ext:1,orth:0}};
const TG={bis:[['inc','İç teğet çember'],['thm','Açıortay teoremi (A köşesi)'],['arc','Eş açıları göster'],['pg','Açıortay üzerinde G noktası'],['ex','Dış açıortay (A köşesi)'],['exc','Dış teğet çemberler']],med:[['ratio','2 : 1 oranı'],['area','Altı eş alan'],['mid','Orta üçgen']],per:[['circ','Çevrel çember'],['eq','Köşelere eşit uzaklık'],['pt','Orta dik üzerinde P noktası']],alt:[['ext','Ayaklar ve dik açı işareti'],['orth','Ortodik üçgen']]};
const DEF={bis:'Açıortay: Bir açıyı iki eş açıya ayıran ışındır. Üç iç açıortay, iç teğet çemberin merkezi olan I noktasında kesişir.',
med:'Kenarortay: Bir köşeyi karşı kenarın orta noktasına birleştiren doğru parçasıdır. Üçü ağırlık merkezi G noktasında kesişir.',
per:'Kenar orta dikme: Bir kenarın orta noktasından geçen ve kenara dik olan doğrudur. Üçü çevrel çemberin merkezi O noktasında kesişir.',
alt:'Yükseklik: Bir köşeden karşı kenara (ya da uzantısına) indirilen dikmedir. Üçü diklik merkezi H noktasında kesişir.'};
const d=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
const lerp=(p,q,t)=>({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t});
const mid=(p,q)=>lerp(p,q,.5);
const unit=(p,q)=>{const l=d(p,q)||1;return{x:(q.x-p.x)/l,y:(q.y-p.y)/l}};
const area=(A,B,C)=>Math.abs((B.x-A.x)*(C.y-A.y)-(C.x-A.x)*(B.y-A.y))/2;
function foot(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy);return{x:a.x+dx*t,y:a.y+dy*t,t}}
function circ(A,B,C){const D=2*(A.x*(B.y-C.y)+B.x*(C.y-A.y)+C.x*(A.y-B.y)),a=A.x**2+A.y**2,b=B.x**2+B.y**2,c=C.x**2+C.y**2;return{x:(a*(B.y-C.y)+b*(C.y-A.y)+c*(A.y-B.y))/D,y:(a*(C.x-B.x)+b*(A.x-C.x)+c*(B.x-A.x))/D}}
const f=(x,n=2)=>(+x).toFixed(n).replace('.',',');
const ang=(a,b,c)=>Math.acos(Math.max(-1,Math.min(1,(b*b+c*c-a*a)/(2*b*c))))*180/Math.PI;
const ln=(p,q,c,w=2,da='')=>`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${c}" stroke-width="${w}" ${da?`stroke-dasharray="${da}"`:''} stroke-linecap="round" ${!da&&anim?'class="dl" pathLength="1"':''}/>`;
const dot=(p,c,r=4.5)=>`<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${c}" class="${anim?'fi':''}"/>`;
const tx=(p,s,c='var(--mute)',dx=0,dy=0)=>`<text x="${p.x+dx}" y="${p.y+dy}" fill="${c}" font-size="${14*zs()}" font-weight="600" text-anchor="middle" style="fill:${c}">${s}</text>`;
const poly=(pts,fill,stroke='none',op=1,da='')=>`<polygon points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="${fill}" fill-opacity="${op}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" class="${anim?'fi':''}" ${da?`stroke-dasharray="${da}"`:''}/>`;
const arc=(V,u1,u2,r,c)=>{const s=u1.x*u2.y-u1.y*u2.x>0?1:0;return `<path d="M${V.x+u1.x*r} ${V.y+u1.y*r}A${r} ${r} 0 0 ${s} ${V.x+u2.x*r} ${V.y+u2.y*r}" fill="none" stroke="${c}" stroke-width="2"/>`};
const sq=(V,u,n,s,c='var(--mute)')=>`<path d="M${V.x+u.x*s} ${V.y+u.y*s}L${V.x+(u.x+n.x)*s} ${V.y+(u.y+n.y)*s}L${V.x+n.x*s} ${V.y+n.y*s}" fill="none" stroke="${c}" stroke-width="1.6"/>`;
const row=(l,v)=>`<div class="row"><span>${l}</span><b>${v}</b></div>`;
const card=(t,b)=>`<div class="fc"><h3>${t}</h3>${b}</div>`;
const fm=s=>`<p class="fm">${s}</p>`;
const note=s=>`<p class="note">${s}</p>`;
const BL='var(--blue)',GR='var(--green)',OR='var(--orange)',PU='var(--purple)';

function draw(){
  const [A,B,C]=P,a=d(B,C),b=d(A,C),c=d(A,B),K=area(A,B,C),Ku=K/(U*U),au=a/U,bu=b/U,cu=c/U;
  const gA=ang(a,b,c),gB=ang(b,a,c),gC=ang(c,a,b),mx=Math.max(gA,gB,gC);
  const kind=(Math.abs(a-b)<4&&Math.abs(b-c)<4)?'Eşkenar üçgen':Math.abs(mx-90)<2?'Dik üçgen':mx>90?'Geniş açılı üçgen':'Dar açılı üçgen';
  const isR=Math.abs(mx-90)<2,isO=mx>=92;
  $('#chip').textContent=kind;
  const G={x:(A.x+B.x+C.x)/3,y:(A.y+B.y+C.y)/3};
  FIT=[...P];let s=poly(P,'var(--ink)','var(--ink)',.05),h='';
  if(mode==='bis'){
    const o=on.bis,D=lerp(B,C,c/(b+c)),E=lerp(A,C,c/(c+a)),F=lerp(A,B,b/(a+b));
    const I={x:(a*A.x+b*B.x+c*C.x)/(a+b+c),y:(a*A.y+b*B.y+c*C.y)/(a+b+c)},r=K/((a+b+c)/2);
    if(o.thm){s+=ln(B,D,GR,7)+ln(D,C,PU,7)+tx(mid(B,D),'|BD|',GR,0,24)+tx(mid(D,C),'|DC|',PU,0,24)}
    if(o.inc){s+=`<circle cx="${I.x}" cy="${I.y}" r="${r}" fill="${BL}" fill-opacity=".08" stroke="${BL}" stroke-width="2"/>`;
      [[A,B],[B,C],[C,A]].forEach(([p,q])=>{const t=foot(I,p,q);s+=ln(I,t,BL,1.5,'4 4')+dot(t,BL,3.5)})}
    s+=ln(A,D,OR)+ln(B,E,OR)+ln(C,F,OR);
    if(o.arc)[[A,B,C,D],[B,A,C,E],[C,A,B,F]].forEach(([V,N1,N2,X])=>{const u1=unit(V,N1),ux=unit(V,X),u2=unit(V,N2);
      s+=arc(V,u1,ux,24,OR)+arc(V,u1,ux,29,OR)+arc(V,ux,u2,24,OR)+arc(V,ux,u2,29,OR)});
    s+=dot(I,BL,6)+tx(I,'I',BL,12,-10)+dot(D,OR)+tx(D,'D',OR,0,-12);
    let bx='';
    if(o.pg){const Gp=lerp(A,D,gt/100),Fp=foot(Gp,A,B),Ep=foot(Gp,A,C);
      s+=ln(A,Fp,GR,3)+ln(A,Ep,GR,3)+ln(Gp,Fp,PU,2)+ln(Gp,Ep,PU,2)+sq(Fp,unit(Fp,A),unit(Fp,Gp),8,PU)+sq(Ep,unit(Ep,A),unit(Ep,Gp),8,PU)+dot(Gp,PU,5.5)+tx(Gp,'G',PU,14,-8)+tx(Fp,'F',GR,0,18)+tx(Ep,'E',GR,0,-10);
      bx+=card('Açıortay üzerindeki nokta',fm('|GF| = |GE| ve |AF| = |AE|')+row('|GF|',f(d(Gp,Fp)/U))+row('|GE|',f(d(Gp,Ep)/U))+row('|AF|',f(d(A,Fp)/U))+row('|AE|',f(d(A,Ep)/U))+note('Açıortay üzerindeki her nokta, açının kollarına eşit uzaklıktadır.'))}
    if(o.ex){const ui=unit(A,D),ue={x:-ui.y,y:ui.x};
      s+=ln({x:A.x-ue.x*4000,y:A.y-ue.y*4000},{x:A.x+ue.x*4000,y:A.y+ue.y*4000},PU,2);
      if(Math.abs(b-c)>2){const Ex={x:(b*B.x-c*C.x)/(b-c),y:(b*B.y-c*C.y)/(b-c)};
        s+=ln(B,Ex,'var(--mute)',1.5,'5 5')+ln(C,Ex,'var(--mute)',1.5,'5 5')+dot(Ex,PU)+tx(Ex,'E',PU,0,-12);FIT.push(Ex);
        bx+=card('Dış açıortay teoremi',fm('|AB| / |AC| = |EB| / |EC|')+row('|AB| / |AC|',f(c/b))+row('|EB| / |EC|',f(d(Ex,B)/d(Ex,C)))+note('A köşesindeki dış açıortay, BC doğrusunu E noktasında keser.'))}
      else bx+=card('Dış açıortay',note('AB = AC iken dış açıortay BC’ye paraleldir, kesişmez. Köşeyi biraz oynat.'))}
    if(o.exc){const k1=b+c-a,k2=a+c-b,k3=a+b-c,sp=(a+b+c)/2;
      const Ia={x:(-a*A.x+b*B.x+c*C.x)/k1,y:(-a*A.y+b*B.y+c*C.y)/k1},Ib={x:(a*A.x-b*B.x+c*C.x)/k2,y:(a*A.y-b*B.y+c*C.y)/k2},Ic={x:(a*A.x+b*B.x-c*C.x)/k3,y:(a*A.y+b*B.y-c*C.y)/k3};
      const xs=[[Ia,K/(sp-a),'Iₐ'],[Ib,K/(sp-b),'I_b'],[Ic,K/(sp-c),'I_c']];
      xs.forEach(([Q,rr,nm])=>{FIT.push(Q);s+=`<circle cx="${Q.x}" cy="${Q.y}" r="${rr}" fill="${PU}" fill-opacity=".06" stroke="${PU}" stroke-width="1.8" stroke-dasharray="6 5" class="${anim?'fi':''}"/>`+dot(Q,PU,4)+tx(Q,nm,PU,0,-10)});
      s+=ln(A,Ia,PU,1.5,'5 4')+ln(B,Ia,PU,1.5,'5 4')+ln(C,Ia,PU,1.5,'5 4');
      bx+=card('Dış teğet çemberler',fm('rₐ = Alan / (s − a)')+row('rₐ',f(xs[0][1]/U))+row('r_b',f(xs[1][1]/U))+row('r_c',f(xs[2][1]/U))+note('İki dış açıortay ile dış açılara komşu olmayan iç açının açıortayı Iₐ’da kesişir. Bir üçgenin üç dış teğet çemberi vardır.'))}
    const BD=d(B,D)/U,DC=d(D,C)/U,Va=Math.sqrt(bu*cu*(1-au*au/((bu+cu)**2))),hA=gA/2;
    h=card('Açıortay teoremi',fm('|BD| / |DC| = c / b')+row('|BD| / |DC|',f(BD/DC))+row('c / b',f(cu/bu)))+
      card('Açıortay uzunluğu',fm('Vₐ = √( b·c·(1 − a² / (b+c)²) )')+row('Formülden Vₐ',f(Va))+row('Ölçülen |AD|',f(d(A,D)/U)))+
      card('İç teğet çember',fm('r = Alan / s  ( s = çevre / 2 )')+row('r',f(r/U))+note('I noktası üç kenara da eşit uzaklıktadır (r).'))+
      card('Açı bağıntıları',row('∠BAD = ∠DAC',f(hA,1)+'°')+row('∠BIC',f(180-(gB+gC)/2,1)+'°')+row('90° + A/2',f(90+gA/2,1)+'°'))+bx
  }
  if(mode==='med'){
    const o=on.med,Ma=mid(B,C),Mb=mid(A,C),Mc=mid(A,B);
    if(o.area){const cl=[BL,GR,OR,PU,'var(--red)','#5ac8fa'];[[A,Mc],[Mc,B],[B,Ma],[Ma,C],[C,Mb],[Mb,A]].forEach(([p,q],i)=>s+=poly([p,q,G],cl[i],'none',.35))}
    if(o.mid)s+=poly([Ma,Mb,Mc],'none',PU,1,'6 5');
    if(o.ratio)s+=ln(A,G,BL,7)+ln(G,Ma,OR,7)+tx(mid(A,G),'2k',BL,-16,0)+tx(mid(G,Ma),'k',OR,16,0);
    s+=ln(A,Ma,GR)+ln(B,Mb,GR)+ln(C,Mc,GR)+dot(Ma,GR)+dot(Mb,GR)+dot(Mc,GR);
    s+=tx(Ma,'Mₐ',GR,0,22)+tx(Mb,'M_b',GR,22,4)+tx(Mc,'M_c',GR,-24,4)+dot(G,BL,6)+tx(G,'G',BL,14,-10);
    const ma=.5*Math.sqrt(2*bu*bu+2*cu*cu-au*au),mb=.5*Math.sqrt(2*au*au+2*cu*cu-bu*bu),mc=.5*Math.sqrt(2*au*au+2*bu*bu-cu*cu);
    const hyp=isR?(Math.abs(gA-90)<2?'A':Math.abs(gB-90)<2?'B':'C'):'';
    let rt='';
    if(isR){const i=[gA,gB,gC].findIndex(g=>Math.abs(g-90)<2),V=P[i],[p1,q1]=P.filter((_,j)=>j!==i),Mh=mid(p1,q1);
      s+=`<circle cx="${Mh.x}" cy="${Mh.y}" r="${d(p1,q1)/2}" fill="none" stroke="${PU}" stroke-width="1.8" stroke-dasharray="6 5"/>`;
      rt=card('Dik üçgende',fm('|AD| = |BD| = |CD| = hipotenüs / 2')+row('Dik köşeden kenarortay',f(d(V,Mh)/U))+row('Hipotenüs / 2',f(d(p1,q1)/2/U))+note('Hipotenüsün orta noktası üç köşeye de eşit uzaklıktadır.'))}
    h=card('Kenarortay uzunluğu',fm('mₐ = ½ · √(2b² + 2c² − a²)')+row('Formülden mₐ',f(ma))+row('Ölçülen |AMₐ|',f(d(A,Ma)/U)))+
      card('Ağırlık merkezi G',fm('|AG| : |GMₐ| = 2 : 1')+row('|AG|',f(d(A,G)/U))+row('|GMₐ|',f(d(G,Ma)/U))+row('Oran',f(d(A,G)/d(G,Ma))+' : 1')+note('G = (A + B + C) / 3 ; her kenarortayı köşeden itibaren 2 : 1 böler.'))+
      card('Alan özelliği',fm('Her kenarortay alanı iki eşit parçaya böler')+row('Alan(ABC)',f(Ku))+row('Altı üçgenden her biri',f(Ku/6))+note('Üçgen, kenarortaylarla 6 eş alanlı parçaya ayrılır.'))+
      card('Apollonius bağıntısı',fm('mₐ² + m_b² + m_c² = ¾ (a² + b² + c²)')+row('Sol taraf',f(ma*ma+mb*mb+mc*mc))+row('Sağ taraf',f(.75*(au*au+bu*bu+cu*cu))))+
      rt
  }
  if(mode==='per'){
    const o=on.per,O=circ(A,B,C),R=d(O,A),Ms=[mid(B,C),mid(A,C),mid(A,B)],sd=[[B,C],[A,C],[A,B]];
    if(o.circ)s+=`<circle cx="${O.x}" cy="${O.y}" r="${R}" fill="${BL}" fill-opacity=".05" stroke="${BL}" stroke-width="2"/>`;
    sd.forEach(([p,q],i)=>{const u=unit(p,q),n={x:-u.y,y:u.x},M=Ms[i];
      s+=ln({x:M.x-n.x*4000,y:M.y-n.y*4000},{x:M.x+n.x*4000,y:M.y+n.y*4000},OR,2)+sq(M,u,n,9)+dot(M,OR)});
    if(o.eq)s+=ln(O,A,PU,1.8,'6 5')+ln(O,B,PU,1.8,'6 5')+ln(O,C,PU,1.8,'6 5');
    FIT.push(O);s+=dot(O,BL,6)+tx(O,'O',BL,14,-10);
    const Mbc=Ms[0],u=unit(B,C),n={x:-u.y,y:u.x},Pt={x:Mbc.x+n.x*tt,y:Mbc.y+n.y*tt};
    if(o.pt)s+=ln(Pt,B,GR,1.8,'5 4')+ln(Pt,C,GR,1.8,'5 4')+dot(Pt,GR,5.5)+tx(Pt,'P',GR,14,-8);
    h=(o.pt?card('Orta dik üzerindeki nokta',fm('P orta dik üzerindeyse |PB| = |PC|')+row('|PB|',f(d(Pt,B)/U))+row('|PC|',f(d(Pt,C)/U))+note('Kaydırıcıyla P’yi hareket ettir; eşitlik hep korunur.')):'')+
      card('Çevrel çember merkezi O',row('|OA|',f(d(O,A)/U))+row('|OB|',f(d(O,B)/U))+row('|OC|',f(d(O,C)/U))+note('O, üç köşeye de eşit uzaklıktadır; bu uzaklık R’dir.'))+
      card('Çevrel çember yarıçapı',fm('R = a·b·c / (4·Alan)')+row('R (formül)',f(au*bu*cu/(4*Ku)))+row('R = a / (2·sin A)',f(au/(2*Math.sin(gA*Math.PI/180))))+row('Ölçülen R',f(R/U)))+
      card('O’nun konumu',row('Üçgen türü',kind)+note(isR?'Dik üçgende O, hipotenüsün orta noktasıdır.':isO?'Geniş açılı üçgende O, üçgenin dışındadır.':'Dar açılı üçgende O, üçgenin içindedir.'))
  }
  if(mode==='alt'){
    const o=on.alt,O=circ(A,B,C),Hp={x:A.x+B.x+C.x-2*O.x,y:A.y+B.y+C.y-2*O.y};
    const sets=[[A,B,C,'D'],[B,A,C,'E'],[C,A,B,'F']],ft=sets.map(([V,p,q])=>foot(V,p,q));
    if(o.orth)s+=poly(ft,PU,PU,.1,'6 5');
    sets.forEach(([V,p,q,nm],i)=>{const t=ft[i];
      if(t.t<0)s+=ln(p,t,'var(--mute)',1.5,'5 5');else if(t.t>1)s+=ln(q,t,'var(--mute)',1.5,'5 5');
      s+=ln(V,t,GR);
      if(o.ext){const sd=unit(p,q),u=t.t<.5?sd:{x:-sd.x,y:-sd.y};s+=sq(t,{x:u.x*(t.t<0||t.t>1?(t.t<0?1:-1)*(t.t<.5?1:-1):1),y:u.y*(t.t<0||t.t>1?(t.t<0?1:-1)*(t.t<.5?1:-1):1)},unit(t,V),9)+dot(t,GR)+tx(t,nm,GR,0,22)}});
    FIT.push(Hp);s+=dot(Hp,BL,6)+tx(Hp,'H',BL,14,-10);
    const hs=[2*Ku/au,2*Ku/bu,2*Ku/cu];
    const pos=isR?'Dik açılı köşede':isO?'Üçgenin dışında':'Üçgenin içinde';
    let ex='';
    if(!isR&&!isO&&d(Hp,B)>3&&d(Hp,C)>3){const v1={x:B.x-Hp.x,y:B.y-Hp.y},v2={x:C.x-Hp.x,y:C.y-Hp.y};const g=Math.acos((v1.x*v2.x+v1.y*v2.y)/(Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y)))*180/Math.PI;
      ex=card('Açı bağıntısı (dar açılı)',fm('∠BHC = 180° − A')+row('∠BHC',f(g,1)+'°')+row('180° − A',f(180-gA,1)+'°'))}
    h=card('Yükseklik uzunluğu',fm('hₐ = 2·Alan / a')+row('hₐ',f(hs[0]))+row('h_b',f(hs[1]))+row('h_c',f(hs[2])))+
      card('Alan bağıntısı',fm('a·hₐ = b·h_b = c·h_c = 2·Alan')+row('a·hₐ',f(au*hs[0]))+row('b·h_b',f(bu*hs[1]))+row('c·h_c',f(cu*hs[2]))+row('2·Alan',f(2*Ku)))+
      card('Diklik merkezi H',row('H’nin konumu',pos)+note('Geniş açılı üçgende yükseklikler kenarların uzantılarına iner (kesikli çizgiler).'))+ex+
      card('Özel durum',note('İkizkenar üçgende tabana ait yükseklik; açıortay, kenarortay ve kenar orta dikmeyle çakışır. Eşkenar üçgende dört elemanın hepsi çakışır; “Eşkenar” düğmesini dene.'))
  }
  const lab=(V,s2)=>{const u=unit(G,V);return tx(V,s2,'var(--ink)',u.x*24*zs(),u.y*24*zs()+5*zs())};
  s+=P.map((p,i)=>`<g data-i="${i}" style="cursor:grab"><circle cx="${p.x}" cy="${p.y}" r="${22*zs()}" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="${8*zs()}" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/></g>`).join('');
  s+=lab(A,'A')+lab(B,'B')+lab(C,'C');
  $('#g').innerHTML=s;$('#facts').innerHTML=h;
  if(anim){const fc=$('#facts');fc.classList.remove('fi');void fc.offsetWidth;fc.classList.add('fi')}
  anim=false;
}
function ctrls(){
  $('#desc').textContent=DEF[mode];
  $('#ctrls').innerHTML=TG[mode].map(([k,l])=>`<label class="tg">${l}<input type="checkbox" data-k="${k}" ${on[mode][k]?'checked':''}></label>`).join('')+
    (mode==='per'?`<div class="sl">P noktasını kaydır<input type="range" id="sl" min="-170" max="170" value="${tt}"></div>`:'')+(mode==='bis'?`<div class="sl">G noktasını kaydır<input type="range" id="gs" min="10" max="130" value="${gt}"></div>`:'');
}
$('#ctrls').addEventListener('input',e=>{const t=e.target;if(t.dataset.k){on[mode][t.dataset.k]=t.checked?1:0}else if(t.id==='sl')tt=+t.value;else if(t.id==='gs')gt=+t.value;anim=!!t.dataset.k;draw()});
$('#tabs').addEventListener('click',e=>{const m=e.target.dataset.m;if(!m)return;mode=m;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));ctrls();anim=true;draw()});
$('#presets').addEventListener('click',e=>{const p=e.target.dataset.p;if(!p)return;tween(PR[p])});
let drag=-1;const sv=$('#sv');
const pt=e=>{const r=sv.getBoundingClientRect();return{x:vb.x+(e.clientX-r.left)*vb.w/r.width,y:vb.y+(e.clientY-r.top)*vb.h/r.height}};
sv.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-i]');cancelAnimationFrame(vbRaf);vbT=null;if(t){drag=+t.dataset.i;stopPlay()}else pan={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};try{sv.setPointerCapture(e.pointerId)}catch(_){}});
sv.addEventListener('pointermove',e=>{if(pan){const r=sv.getBoundingClientRect();vb.x=pan.vx-(e.clientX-pan.x)*vb.w/r.width;vb.y=pan.vy-(e.clientY-pan.y)*vb.h/r.height;sv.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);return}if(drag<0)return;const p=pt(e),q=P.map(v=>({...v}));q[drag]={x:Math.min(vb.x+vb.w-24,Math.max(vb.x+24,p.x)),y:Math.min(vb.y+vb.h-24,Math.max(vb.y+24,p.y))};if(area(q[0],q[1],q[2])>2500){P=q;draw()}});
sv.addEventListener('pointerup',()=>{drag=-1;pan=null});
sv.addEventListener('pointercancel',()=>{drag=-1;pan=null});
let raf=0;
function stopPlay(){playing=0;$('#play').textContent='▶ Hareket'}
function tween(T){stopPlay();cancelAnimationFrame(raf);const S=P.map(v=>({...v})),t0=performance.now();
  const step=now=>{let k=Math.min(1,(now-t0)/800);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const q=S.map((v,i)=>({x:v.x+(T[i][0]-v.x)*k,y:v.y+(T[i][1]-v.y)*k}));
    if(area(q[0],q[1],q[2])>300){P=q;draw()}
    if(k<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step)}
$('#play').onclick=()=>{
  if(playing){stopPlay();return}
  cancelAnimationFrame(raf);playing=1;$('#play').textContent='❚❚ Durdur';
  const B0=P.map(v=>({...v})),t0=performance.now();
  const loop=now=>{if(!playing)return;const t=(now-t0)/1000;
    const q=B0.map((v,i)=>({x:Math.min(W-24,Math.max(24,v.x+50*Math.sin(t*.9+i*2.1))),y:Math.min(H-24,Math.max(24,v.y+35*Math.cos(t*.7+i*1.7)))}));
    if(area(q[0],q[1],q[2])>2500)P=q;
    tt=110*Math.sin(t*1.2);gt=70+55*Math.sin(t*1.1);
    const sl=$('#sl');if(sl)sl.value=tt;const gs=$('#gs');if(gs)gs.value=gt;
    draw();raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop)};
function setVB(){sv.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);draw()}
let vbRaf=0,vbT=null;
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function goVB(T,dur=480){cancelAnimationFrame(vbRaf);vbT=T;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!dur){vb={...T};vbT=null;setVB();return}
  const S={...vb},t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=ease(k);
    vb={x:S.x+(T.x-S.x)*e,y:S.y+(T.y-S.y)*e,w:S.w+(T.w-S.w)*e,h:S.h+(T.h-S.h)*e};setVB();
    if(k<1)vbRaf=requestAnimationFrame(step);else vbT=null};
  vbRaf=requestAnimationFrame(step)}
function zoomAt(c,k,dur=380){const b=vbT||vb,nw=Math.min(3200,Math.max(160,b.w*k)),k2=nw/b.w;
  goVB({x:c.x-(c.x-b.x)*k2,y:c.y-(c.y-b.y)*k2,w:nw,h:nw*H/W},dur)}
const vc=()=>({x:vb.x+vb.w/2,y:vb.y+vb.h/2});
$('#zin').onclick=()=>zoomAt(vc(),1/1.3);
$('#zout').onclick=()=>zoomAt(vc(),1.3);
$('#zrst').onclick=()=>goVB({x:0,y:0,w:W,h:H},600);
$('#zfit').onclick=()=>{const xs=FIT.map(p=>p.x),ys=FIT.map(p=>p.y),x0=Math.min(...xs)-50,x1=Math.max(...xs)+50,y0=Math.min(...ys)-50,y1=Math.max(...ys)+50;
  let w=Math.max(x1-x0,(y1-y0)*W/H);w=Math.min(3200,Math.max(W,w));const h=w*H/W;goVB({x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h},650)};
sv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(pt(e),e.deltaY>0?1.15:1/1.15,220)},{passive:false});
const RT=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
const dk=()=>RT.dataset.theme?RT.dataset.theme==='dark':mq.matches;
const th=()=>$('#theme').textContent=dk()?'☀︎ Açık mod':'☾ Koyu mod';
$('#theme').onclick=()=>{RT.dataset.theme=dk()?'light':'dark';th()};
mq.addEventListener&&mq.addEventListener('change',()=>{if(!RT.dataset.theme)th()});
th();ctrls();draw();
</script>
</body>
